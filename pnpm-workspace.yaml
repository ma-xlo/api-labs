packages:
  - "packages/*"
  - "labs/*/server"
  - "labs/*/client"

# Uma linha por dependência, para todos os labs.
# Subir versão em 22 labs = editar aqui e rodar `pnpm install`.
catalog:
  # --- servidor ---
  express: ^5.2.1
  "@types/express": ^5.0.6
  cookie-parser: ^1.4.7
  "@types/cookie-parser": ^1.4.9
  cors: ^2.8.5
  "@types/cors": ^2.8.19
  # Release candidate: pin EXATO, sem ^. Um RC muda API entre patches.
  drizzle-orm: 1.0.0-rc.4
  drizzle-kit: 1.0.0-rc.4
  pg: ^8.22.0
  "@types/pg": ^8.20.0
  ioredis: ^6.0.0
  zod: ^4.6.5
  dotenv: ^17.4.2
  # Binários pré-compilados. O pacote `argon2` exige node-gyp e quebra no pnpm 10.
  "@node-rs/argon2": ^2.2.1

  # --- cliente ---
  react: ^19.3.0
  react-dom: ^19.3.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  vite: ^8.3.1
  "@vitejs/plugin-react": ^6.1.1

  # --- ferramentas ---
  vitest: ^5.0.2
  jsdom: ^30.1.1
  supertest: ^7.3.0
  "@types/supertest": ^6.0.3
  tsx: ^4.23.1
  typescript: ^6.0.3
  "@types/node": ^26.6.3
